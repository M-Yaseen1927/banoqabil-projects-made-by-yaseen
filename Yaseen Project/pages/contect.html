<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Clothing Store</title>
    <link rel="stylesheet" href="../assets/contect-styling.css" />
    <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon" />
  </head>
  <body>
    <header>
      <h1>Clothing Store</h1>
    </header>

    <div class="contact-container">
      <h2>Get In Touch With Us</h2>

      <form>
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea
          name="message"
          rows="5"
          placeholder="Your Message"
          required
        ></textarea>
        <button type="submit">Send Message</button>
      </form>

      <div class="contact-info">
        <h3>Our Contact Info</h3>
        <p><strong>Phone:</strong> +92 301 2645 808</p>
        <p><strong>Email:</strong> info@example.com</p>
        <p><strong>Address:</strong> 123 Main Street, Karachi, Pakistan</p>
      </div>

      <div class="back-container">
        <a href="../index.html" class="back-link">&#8592; Back to Home</a>
      </div>
    </div>

    <footer>&copy; 2025 Clothing Store. All rights reserved.</footer>
  </body>
</html>
